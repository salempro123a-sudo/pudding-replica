<article class="product" data-category="$category" data-search="$name $short">
  <a class="product-photo photo-$photo" href="${base}del-horno/$slug/" aria-label="Conocer $name"><span class="product-tag">$tag</span></a>
  <div class="product-info">
    <div class="product-top"><h3><a href="${base}del-horno/$slug/">$name</a></h3><span class="price">$display_price</span></div>
    <p>$short</p>
    <button class="add" data-add="$id" aria-label="Añadir $name a mi pedido"><span>Añadir a mi pedido</span><span aria-hidden="true">+</span></button>
  </div>
</article>
